# FedCGS (Guan et al., AAAI 2025) on cached features of a frozen backbone: the paper's one-shot setting (one task with all 100 classes, 10 clients, Dirichlet 0.05).
# The method has no trained part and one hyperparameter, gamma (0 = the official code). See reports/FEDCGS.md.
# Needs:  cd dataset
#         python prepare_data.py CIFAR100 --download
#         python generate_scenario.py CIFAR100 dir --num_clients 10 --alpha 0.05 --class_per_task 100 --seed 0 --num_seeds 3
#         python extract_features.py CIFAR100 --backbone vit_b16_in21k
# Check:  cd system && python main.py -cfg configs/fedcgs/fedcgs_cifar100_vit_in21k_oneshot.yaml --dry_run
# Run:    cd system && python main.py -cfg configs/fedcgs/fedcgs_cifar100_vit_in21k_oneshot.yaml
# Official code on the same features:
#         cd system && python check_fedcgs_official.py --official <FedCGS clone> -cfg configs/fedcgs/fedcgs_cifar100_vit_in21k_oneshot.yaml
# Another backbone: add  -bb dinov2_vitb14  (or clip_vitb16) to the command line, after extracting its cache.
scenario:
  dataset: CIFAR100
  partition: dir
  num_clients: 10
  alpha: 0.05
  class_per_task: 100        # one task: the paper's one-shot FL
features:
  backbone: vit_b16_in21k
  group: last_ln             # the last block after the backbone's final norm
  blocks: [11]
  tokens: [cls]              # the model's own pooled feature (the official code uses ResNet-18's pooled output)
schedule:
  regime: single_round       # one upload per client per task
algorithm:
  name: FedCGS
  hparams:
    gamma: 0.0               # the official value (main_fedcgs.py: gamma_list = [0])
run:
  seed: 0
  times: 3                   # scenario seeds 0, 1, 2; report all three
  goal: fedcgs
  device: cpu                # numpy only
